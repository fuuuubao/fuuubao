<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project3_ex001</title>
    <!-- 제이쿼리cdn -->
    <script src="http://code.jquery.com/jquery-latest.js"></script>




    <style>
        * {margin: 0;
            padding: 0;}
        ul {list-style: none;}
        
        body {}


        header {position: absolute;
        width: 100%;
    height: 120px;
background-color: gray;
display: flex;
align-items: center;
z-index: 99;
opacity: 0.5;
left: 0;
top: calc(100% - 120px)}





        header h1 {width: 10%;}
        header nav {width: 90%;}
        header nav ul {display: flex;
        width: 100%;
    justify-content: space-around;}
        header nav ul li {padding: 20px;
        cursor: pointer;
        color: #fff;}
        header li:hover {text-decoration: underline;}



header.on {position: fixed;
            top: 0;}



            
        section {
        width: 100%;
    height: 100vh;
background-color: #ccc;

left: 0;
z-index: 1;
perspective: 2500px;
}

        section>article {width: 100%;
                        height: 100%;
                        display: flex;
                    justify-content: center;
                align-items: center;
            font-size: 160px;}

        /* 세부내용을 정리하기 위해 flex해놓고 정리한다 */
        section>article:nth-child(1) {background-color: darkolivegreen;
           
    
    }
        section>article:nth-child(2) {background-color: red;
    
        
        }
        section>article:nth-child(3) {background-color: chartreuse;
       
    }
        section>article:nth-child(4) {background-color: wheat;
          
        
}


            section>article.on {
                z-index: 2;
                opacity: 1;
            }


          .btn {position: fixed;
        width: 50px;
    height: 50px;
border-radius: 50px;
border: 1px solid #000;
cursor: pointer;
bottom: 50px;
right: 50px;
text-align: center;
line-height: 2.8;
display: none;
animation: ani infinite 0.8s alternate;
box-shadow: 2px 2px 5px #aaa; 
 }  

@keyframes ani {

    0% {bottom: 50px;}
    100% {bottom: 55px;}
}

.btn:hover {background-color: #000;
            color: #fff;}
    </style>


<script>

    $(document).ready(function(){


        // nav li를 클릭했을때, 
        // 1순번찾기
        // 2.클릭한순번에 맞춰 article에게 Class값주기
        // article의 높이를 찾아 변수랑 곱해주기
        $('nav li').click(function(){

            var i = $(this).index()
            var aht2 = $('article').height()
            console.log(i)
            $('article').removeClass('on')

            $('article').eq(i).addClass('on')

            $('html,body').stop().animate({'scrollTop':i*aht2},1200)
        })

        // btn을 클릭했을때 스크롤 탑이 0이되어라.

        $('.btn').click(function(){

            $('html,body').stop().animate({'scrollTop':0},1500)

        })









         // 1.스크롤의 값을 찾기
         $(window).scroll(function(){

var sc = $(this).scrollTop()
console.log(sc);

// header가 브라우저의 상단에 맞닿았을떄의 sc의 위치값을 맞춰라
$('h1').text(sc)

var aht = $('article').height();
var hht = $('header').height();
$('nav li').eq(0).text(aht)
$('nav li').eq(1).text(hht)
$('nav li').eq(2).text(aht - hht)

if(sc>=aht-hht){

    $('header').addClass('on')


}else{

    $('header').removeClass('on')
}

// sc가 세번째 article에 높이만큼 보다 크거나 같을때, btn을 보여라

if(sc>=aht*2){

$('.btn').fadeIn('slow')

}else{

    $('.btn').fadeOut('fast')
}


         })
        
    })


</script>
</head>
<body>
    <header class="">
        <h1>로고</h1>
        <nav>
            <ul>
                <li>home</li>
                <li>profile</li>
                <li>gallery</li>
                <li>자유주제</li>
            </ul>
        </nav>
    </header>


    <section>
        <article class="on">menu1</article>
        <article>menu2</article>
        <article>menu3</article>
        <article>menu4</article>
    </section>


    <div class="btn">Top</div>
</body>
</html>
